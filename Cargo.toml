[package]
name = "acadsharp-rs"
version = "0.1.0"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
license = "MIT"
description = "Safe, idiomatic Rust decoder for DWG backed by the ACadSharp NativeAOT artifacts from libviprs-dep"
repository = "https://github.com/libviprs/acadsharp-rs"
# Matches the floor the rest of the org declares. The `msrv` CI job pins this
# exact toolchain and fails if this line, the toolchain it installs and the
# README ever disagree.
rust-version = "1.97"
# This package owns the ACadSharp native library, and says so. Three things
# come with it: cargo refuses a graph where two packages link the same native
# library, the build script's `cargo::metadata=` lines reach a downstream build
# script as `DEP_ACADSHARP_NATIVE_*` (which is how `libviprs` is meant to learn
# where the archive is), and cargo knows to rerun dependents when the archive
# moves. Adding it after publication changes the shape of the dependency graph,
# so it goes in now while it is free.
links = "acadsharp_native"

[lints.rust]
deprecated = "deny"

[lints.clippy]
incompatible_msrv = "warn"

[features]
# Which way the native library gets linked. One feature, off by default, and
# off means the shared link.
#
# There is deliberately only one. Cargo features are additive: any crate in a
# graph may turn one on and none of them can turn another's off. A `link-shared`
# beside this used to exist, and a graph with one dependency asking for each
# unified both on and panicked in this crate's build script with advice neither
# author could act on. With no feature at all the plan is already the shared
# one, so the second feature carried that hazard and bought nothing.
#
# `link-static` needs an archive whose manifest says `static_certified: true`,
# which is a measurement: true only where the producer linked the static
# archive into a probe program and ran it on that target. It is also the mode
# to deploy in: a shared link leaves every downstream binary needing an rpath,
# an LD_LIBRARY_PATH or a build script of its own.
link-static = []

[dependencies]

# Both of these are build-time only and neither reaches a consumer's binary.
# `metadata/LINKINFO.json` arrives inside a downloaded tarball and every string
# in it that the build script repeats to cargo is a string that tarball chose,
# so it gets a real parser. Hand-rolling one for a twenty-key manifest is two
# hundred lines that then need fuzzing for no runtime benefit, and the first
# attempt at it accepted a raw newline inside a string, which turned out to be
# arbitrary linker flags on the real link line.
#
# The crate's runtime dependency count stays zero, which is the number that
# matters.
[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The allocation proof runs without the test harness on purpose. It arms a
# counting global allocator, and a second test thread allocating inside that
# window would make the number it reports mean nothing.
[[test]]
name = "alloc_bound"
path = "tests/alloc_bound.rs"
harness = false
